<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus TV Station — UK · USA · Canada</title>
<style>
  :root { --bg:#0b0d12; --panel:#141821; --panel2:#1b2130; --line:#262d3d; --text:#e8ebf2; --muted:#8b94a8; --accent:#5b9dff; --good:#3ecf8e; --bad:#ff6b6b; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--text); font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; display:flex; flex-direction:column; }
  header { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; padding:10px 14px; background:var(--panel); border-bottom:1px solid var(--line); }
  h1 { font-size:16px; margin:0; font-weight:700; letter-spacing:.3px; }
  .tabs { display:flex; gap:6px; }
  .tab { background:var(--panel2); color:var(--text); border:1px solid var(--line); padding:6px 14px; border-radius:8px; cursor:pointer; font:inherit; }
  .tab[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#04101f; font-weight:700; }
  .opts { display:flex; flex-wrap:wrap; gap:6px 14px; margin-left:auto; color:var(--muted); }
  .opts label { display:flex; align-items:center; gap:5px; cursor:pointer; }
  main { flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) 380px; }
  @media (max-width:860px) { main { grid-template-columns:1fr; grid-template-rows:auto minmax(0,1fr); } }
  .stage { padding:12px; display:flex; flex-direction:column; gap:10px; min-width:0; }
  .screen { position:relative; background:#000; border-radius:10px; overflow:hidden; aspect-ratio:16/9; width:100%; max-height:calc(100vh - 220px); }
  video { width:100%; height:100%; background:#000; display:block; }
  .status { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px; color:var(--muted); background:rgba(0,0,0,.55); pointer-events:none; }
  .status.hidden { display:none; }
  .status.err { color:var(--bad); }
  .now { display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
  .now .meta { flex:1; min-width:180px; }
  .now .name { font-size:18px; font-weight:700; }
  .now .sub { color:var(--muted); font-size:12px; }
  .btn { background:var(--panel2); color:var(--text); border:1px solid var(--line); padding:7px 12px; border-radius:8px; cursor:pointer; font:inherit; text-decoration:none; }
  .btn:hover { border-color:var(--accent); }
  aside { border-left:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0; }
  @media (max-width:860px) { aside { border-left:0; border-top:1px solid var(--line); } }
  .filters { display:flex; gap:8px; padding:10px; border-bottom:1px solid var(--line); }
  .filters input, .filters select { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 9px; font:inherit; min-width:0; }
  .filters input { flex:1; }
  .filters select { max-width:42%; }
  .count { padding:6px 12px; color:var(--muted); font-size:12px; border-bottom:1px solid var(--line); }
  #list { flex:1; overflow-y:auto; min-height:0; }
  .ch { display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--line); color:var(--text); padding:8px 12px; cursor:pointer; font:inherit; }
  .ch:hover { background:var(--panel2); }
  .ch[aria-current="true"] { background:#1d2a45; box-shadow:inset 3px 0 0 var(--accent); }
  .ch img { width:34px; height:34px; object-fit:contain; background:#0006; border-radius:6px; flex:none; }
  .ch .ph { width:34px; height:34px; border-radius:6px; background:var(--panel2); flex:none; }
  .ch .t { min-width:0; flex:1; }
  .ch .n { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ch .g { color:var(--muted); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tag { font-size:10px; padding:1px 6px; border-radius:6px; border:1px solid var(--line); color:var(--muted); flex:none; }
  .tag.dead { color:var(--bad); border-color:var(--bad); }
  .tag.ext { color:#d9b34a; border-color:#d9b34a; }
  .more { margin:10px; width:calc(100% - 20px); }
  .empty { padding:24px; text-align:center; color:var(--muted); }
  .toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#000d; color:#fff; padding:8px 14px; border-radius:8px; z-index:9; }
</style>
</head>
<body>
<header>
  <h1>📺 Nexus TV Station</h1>
  <div class="tabs" id="tabs" role="group" aria-label="Region">
    <button class="tab" data-region="UK" aria-pressed="false">UK</button>
    <button class="tab" data-region="USA" aria-pressed="false">USA</button>
    <button class="tab" data-region="Canada" aria-pressed="false">Canada</button>
  </div>
  <div class="opts">
    <label title="Hide streams a secure (https) web page cannot play"><input type="checkbox" id="optPlayable" checked> Browser-playable only</label>
    <label title="If a channel fails, jump to the next one"><input type="checkbox" id="optSkip" checked> Auto-skip dead channels</label>
  </div>
</header>
<main>
  <section class="stage">
    <div class="screen">
      <video id="video" controls playsinline></video>
      <div class="status" id="status">Pick a channel from the list to start watching.</div>
    </div>
    <div class="now">
      <div class="meta"><div class="name" id="nowName">—</div><div class="sub" id="nowSub">No channel selected</div></div>
      <button class="btn" id="prev" title="Previous channel (↑)">◀ Prev</button>
      <button class="btn" id="next" title="Next channel (↓)">Next ▶</button>
      <button class="btn" id="copy">Copy stream URL</button>
      <a class="btn" id="playlist" target="_blank" rel="noopener">Playlist (.m3u)</a>
    </div>
  </section>
  <aside>
    <div class="filters">
      <input type="search" id="search" placeholder="Search channels…" aria-label="Search channels">
      <select id="group" aria-label="Group"><option value="">All groups</option></select>
    </div>
    <div class="count" id="count">Loading…</div>
    <div id="list"></div>
  </aside>
</main>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script>
(function () {
  'use strict';
  var BASE = 'https://raw.githubusercontent.com/banamine/AJN-Collection-/main/LiveTV/';
  var PAGE_SIZE = 300;
  var START_TIMEOUT_MS = 20000;
  var MAX_AUTO_SKIPS = 10;

  var $ = function (id) { return document.getElementById(id); };
  var video = $('video'), statusEl = $('status'), listEl = $('list');

  var all = [], view = [], shown = PAGE_SIZE;
  var current = null, hls = null, startTimer = null, skips = 0, playToken = 0, loadSeq = 0;
  var dead = new Set();   // URLs that failed this session
  var region = 'USA';

  // ---- small helpers ----
  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function toast(msg) {
    var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2500);
  }
  function setStatus(msg, isErr) {
    statusEl.textContent = msg || '';
    statusEl.classList.toggle('hidden', !msg);
    statusEl.classList.toggle('err', !!isErr);
  }
  // A secure page cannot load plain-http streams (browser blocks them as mixed content).
  function blockedByBrowser(url) { return location.protocol === 'https:' && /^http:/i.test(url); }

  // ---- M3U parsing ----
  function parseM3U(text) {
    var out = [], cur = null, lines = text.split(/\r?\n/);
    var infRe = /^#EXTINF:[^,"]*(?:"[^"]*"[^,"]*)*,(.*)$/;
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (line.indexOf('#EXTINF') === 0) {
        var m = infRe.exec(line);
        var logo = /tvg-logo="([^"]*)"/.exec(line);
        var grp = /group-title="([^"]*)"/.exec(line);
        cur = { name: (m && m[1].trim()) || 'Unnamed', group: (grp && grp[1]) || 'Uncategorized', logo: (logo && logo[1]) || '' };
      } else if (cur && /^https?:\/\//i.test(line)) {
        cur.url = line; out.push(cur); cur = null;
      }
    }
    return out;
  }

  // ---- loading a region ----
  function loadRegion(r) {
    region = r;
    store('nexus.region', r);
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.region === r));
    });
    $('playlist').href = BASE + r + '/LiveTV.m3u';
    $('count').textContent = 'Loading ' + r + '…';
    listEl.innerHTML = '';
    var token = ++loadSeq;
    fetch(BASE + r + '/LiveTV.m3u', { cache: 'no-cache' })
      .then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.text(); })
      .then(function (text) {
        if (token !== loadSeq) return;
        if (text.replace(/^﻿/, '').trimStart().indexOf('#EXTM3U') !== 0) throw new Error('Not an M3U playlist');
        all = parseM3U(text);
        fillGroups();
        applyFilters();
        if (!all.length) $('count').textContent = r + ' playlist is empty right now.';
      })
      .catch(function (e) {
        if (token !== loadSeq) return;
        all = []; view = []; renderList();
        $('count').textContent = 'Could not load ' + r + ' (' + e.message + ').';
      });
  }

  function fillGroups() {
    var sel = $('group'), groups = {};
    all.forEach(function (c) { groups[c.group] = (groups[c.group] || 0) + 1; });
    sel.innerHTML = '';
    var o = document.createElement('option'); o.value = ''; o.textContent = 'All groups'; sel.appendChild(o);
    Object.keys(groups).sort().forEach(function (g) {
      var op = document.createElement('option'); op.value = g; op.textContent = g + ' (' + groups[g] + ')'; sel.appendChild(op);
    });
  }

  function applyFilters() {
    var q = $('search').value.trim().toLowerCase(), g = $('group').value, onlyOk = $('optPlayable').checked;
    view = all.filter(function (c) {
      if (onlyOk && blockedByBrowser(c.url)) return false;
      if (g && c.group !== g) return false;
      return !q || c.name.toLowerCase().indexOf(q) !== -1 || c.group.toLowerCase().indexOf(q) !== -1;
    });
    shown = PAGE_SIZE;
    renderList();
  }

  function renderList() {
    listEl.innerHTML = '';
    var hidden = all.length - view.length;
    $('count').textContent = view.length + ' channels' + (hidden > 0 ? ' · ' + hidden + ' hidden by filters' : '');
    if (!view.length) { var e = document.createElement('div'); e.className = 'empty'; e.textContent = all.length ? 'No channels match.' : ''; listEl.appendChild(e); return; }
    var frag = document.createDocumentFragment();
    view.slice(0, shown).forEach(function (c, i) { frag.appendChild(rowFor(c, i)); });
    listEl.appendChild(frag);
    if (view.length > shown) {
      var more = document.createElement('button'); more.className = 'btn more';
      more.textContent = 'Show more (' + (view.length - shown) + ' left)';
      more.onclick = function () { shown += PAGE_SIZE; renderList(); };
      listEl.appendChild(more);
    }
  }

  function rowFor(c) {
    var b = document.createElement('button'); b.className = 'ch'; b.type = 'button';
    if (c === current) b.setAttribute('aria-current', 'true');
    if (c.logo && /^https:/i.test(c.logo)) {
      var img = document.createElement('img'); img.loading = 'lazy'; img.referrerPolicy = 'no-referrer'; img.alt = ''; img.src = c.logo;
      img.onerror = function () { var ph = document.createElement('div'); ph.className = 'ph'; img.replaceWith(ph); };
      b.appendChild(img);
    } else { var ph = document.createElement('div'); ph.className = 'ph'; b.appendChild(ph); }
    var t = document.createElement('div'); t.className = 't';
    var n = document.createElement('div'); n.className = 'n'; n.textContent = c.name;
    var g = document.createElement('div'); g.className = 'g'; g.textContent = c.group;
    t.appendChild(n); t.appendChild(g); b.appendChild(t);
    if (dead.has(c.url)) { var d = document.createElement('span'); d.className = 'tag dead'; d.textContent = 'failed'; b.appendChild(d); }
    else if (blockedByBrowser(c.url)) { var x = document.createElement('span'); x.className = 'tag ext'; x.textContent = 'VLC only'; b.appendChild(x); }
    b.onclick = function () { skips = 0; play(c); };
    return b;
  }

  // ---- playback ----
  function teardown() {
    clearTimeout(startTimer);
    if (hls) { try { hls.stopLoad(); hls.detachMedia(); hls.destroy(); } catch (e) {} hls = null; }  // order matters: avoids leaked buffers
    video.removeAttribute('src'); video.load();
  }

  function play(c) {
    teardown();
    current = c;
    $('nowName').textContent = c.name;
    $('nowSub').textContent = c.group + ' · ' + region;
    store('nexus.channel', c.url);
    renderList();
    if (blockedByBrowser(c.url)) {
      setStatus('This stream is plain http, which a secure web page cannot play. Use "Copy stream URL" and open it in VLC.', true);
      return;
    }
    setStatus('Connecting…');
    var myToken = ++playToken, netRetry = 0, mediaRetry = 0;
    function fail(why) {
      if (myToken !== playToken) return;
      teardown(); dead.add(c.url); renderList();
      setStatus('Stream failed: ' + why, true);
      skipOrStop();
    }
    startTimer = setTimeout(function () { fail('no response'); }, START_TIMEOUT_MS);
    video.onplaying = function () { clearTimeout(startTimer); skips = 0; setStatus(''); };
    video.onerror = function () { fail('player error'); };

    var direct = /\.(mp4|webm|ogv|mp3|aac|m4a)(\?|$)/i.test(c.url);
    if (!direct && window.Hls && Hls.isSupported()) {
      hls = new Hls({ lowLatencyMode: false, maxBufferLength: 30 });
      hls.on(Hls.Events.ERROR, function (ev, d) {
        if (!d.fatal) return;
        if (d.type === Hls.ErrorTypes.NETWORK_ERROR && netRetry++ < 1) hls.startLoad();
        else if (d.type === Hls.ErrorTypes.MEDIA_ERROR && mediaRetry++ < 1) hls.recoverMediaError();
        else fail(d.details || d.type);
      });
      hls.loadSource(c.url);
      hls.attachMedia(video);
      video.play().catch(function () {});
    } else {
      video.src = c.url;   // native HLS (Safari/iOS) or plain media file
      video.play().catch(function () {});
    }
  }

  function skipOrStop() {
    if (!$('optSkip').checked || skips >= MAX_AUTO_SKIPS) { if (skips >= MAX_AUTO_SKIPS) toast('Stopped auto-skipping after ' + MAX_AUTO_SKIPS + ' failures'); return; }
    skips++;
    setTimeout(function () { step(1); }, 1200);
  }

  function step(dir) {
    if (!view.length) return;
    var i = view.indexOf(current);
    for (var n = 0; n < view.length; n++) {
      i = (i + dir + view.length) % view.length;
      if (!dead.has(view[i].url) && !(blockedByBrowser(view[i].url))) {
        if (i >= shown) { shown = i + PAGE_SIZE; }
        play(view[i]);
        var el = listEl.querySelector('[aria-current="true"]'); if (el) el.scrollIntoView({ block: 'nearest' });
        return;
      }
    }
    setStatus('No more playable channels in this view.', true);
  }

  // ---- events ----
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) {
    b.onclick = function () { loadRegion(b.dataset.region); };
  });
  $('search').addEventListener('input', applyFilters);
  $('group').addEventListener('change', applyFilters);
  $('optPlayable').addEventListener('change', function () { store('nexus.playable', this.checked ? '1' : '0'); applyFilters(); });
  $('optSkip').addEventListener('change', function () { store('nexus.skip', this.checked ? '1' : '0'); });
  $('prev').onclick = function () { skips = 0; step(-1); };
  $('next').onclick = function () { skips = 0; step(1); };
  $('copy').onclick = function () {
    if (!current) return toast('Pick a channel first');
    (navigator.clipboard ? navigator.clipboard.writeText(current.url) : Promise.reject()).then(
      function () { toast('Stream URL copied'); }, function () { toast('Copy failed'); });
  };
  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
    if (e.key === 'ArrowDown') { e.preventDefault(); skips = 0; step(1); }
    if (e.key === 'ArrowUp') { e.preventDefault(); skips = 0; step(-1); }
  });
  window.addEventListener('beforeunload', teardown);

  // ---- start ----
  if (load('nexus.playable') === '0') $('optPlayable').checked = false;
  if (load('nexus.skip') === '0') $('optSkip').checked = false;
  var saved = load('nexus.region');
  var q = new URLSearchParams(location.search).get('region');
  loadRegion(['UK', 'USA', 'Canada'].indexOf(q) !== -1 ? q : (['UK', 'USA', 'Canada'].indexOf(saved) !== -1 ? saved : 'USA'));
})();
</script>
</body>
</html>
